  0xA2: {caractere: "Ã", origem: "desenho do projeto"}
  0xA3: {caractere: "Â", origem: "desenho do projeto"}
  0xA4: {caractere: "Á", origem: "desenho do projeto"}
  0xA5: {caractere: "É", origem: "desenho do projeto"}
  0xA6: {caractere: "Ê", origem: "desenho do projeto"}
  0xA7: {caractere: "Í", origem: "desenho do projeto"}
  0xA8: {caractere: "Ó", origem: "desenho do projeto"}
  0xA9: {caractere: "Õ", origem: "desenho do projeto: O da fonte original em 6 linhas + til ondulado de 2 linhas"}
