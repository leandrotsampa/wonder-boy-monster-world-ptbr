  - {bloco: 0x167, ponteiro: 0x4159C, base: {tipo: "02", endereco: 0x6A3F5, bytes: 265}, colunas_png: "16-31"}
  - {bloco: 0x168, ponteiro: 0x415A0, base: {tipo: "02", endereco: 0x6A4FE, bytes: 250}, colunas_png: "32-47"}
