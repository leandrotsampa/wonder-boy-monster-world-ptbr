# Glossário: termos com tradução fixa em todo o jogo.
# O comando `verificar` avisa quando o original contém `en` e a tradução não usa `pt`.
# Formato:
# - en: "Dragon Castle"
#   pt: "Castelo do Dragão"
#   nota: "decisão e motivo"
#
# Lugares: a parte genérica é traduzida e o nome próprio fica (design §5).

- en: "Monster World"
  pt: "Monster World"
  nota: "nome do mundo e do jogo, mantido (piloto)"
- en: "Alsedo"
  pt: "Alsedo"
  nota: "nome próprio da vila das fadas, mantido"
- en: "Purapril"
  pt: "Purapril"
  nota: "nome próprio da capital (e sobrenome da princesa Shiela), mantido"
- en: "Purapril Castle"
  pt: "Castelo de Purapril"
  nota: "parte genérica traduzida (piloto, dialogo.002)"
- en: "Aqua Capital"
  pt: "Capital das Águas"
  nota: "título de Purapril na placa (dialogo.009); mesma forma de 'Capital do Gelo' (confirmado pelo autor)"
- en: "Lilypad"
  pt: "Lilypad"
  nota: "nome próprio da vila dos anões, mantido"
- en: "Maugham Desert"
  pt: "Deserto de Maugham"
  nota: "parte genérica traduzida, Maugham é nome próprio"
- en: "Pyramid"
  pt: "Pirâmide"
  nota: "a pirâmide da Esfinge, depois do deserto; palavra comum, traduzida"
- en: "Begonia"
  pt: "Begonia"
  nota: "nome próprio da vila dos dragões, mantido (sem acento, como no original)"
- en: "Ice Capital"
  pt: "Capital do Gelo"
  nota: "não tem nome próprio: as duas palavras são genéricas e são traduzidas"
- en: "Ice World"
  pt: "Mundo do Gelo"
  nota: "região do Castelo de Gelo (dialogo.073); mesma forma de 'Capital do Gelo'"
- en: "Ice Castle"
  pt: "Castelo de Gelo"
  nota: "o castelo é feito de gelo: 'de Gelo' (material), não 'do Gelo' (região)"
- en: "Childam"
  pt: "Childam"
  nota: "nome próprio da vila do Mundo das Trevas, mantido"
- en: "Darkworld"
  pt: "Mundo das Trevas"
  nota: "o inglês alterna Darkworld, DarkWorld e Devil World para o mesmo lugar; em PT um só nome. Na placa de Childam (dialogo.008) cabe 'Childam, a vila do' / 'Mundo das Trevas'"
- en: "Devil World"
  pt: "Mundo das Trevas"
  nota: "mesmo lugar que Darkworld (ver acima); 'Mundo dos Demônios' soa pesado e não combina com o tom leve"
- en: "Prince of the Devil World"
  pt: "Príncipe do Mundo das Trevas"
  nota: "título, não nome próprio: traduzido, com o lugar como em Darkworld"
- en: "Nightmare Castle"
  pt: "Castelo do Pesadelo"
  nota: "aonde o príncipe vai (dialogo.118); as duas palavras são genéricas"
- en: "Castle of Illusion"
  pt: "Castelo da Ilusão"
  nota: "as duas palavras são genéricas; singular como no inglês"
- en: "Bell Tower"
  pt: "Torre do Sino"
  nota: "torre do Castelo de Purapril (dialogo.073, dialogo.109); 'campanário' é pouco usado na fala"
- en: "Elder Dragon"
  pt: "Dragão Ancião"
  nota: "o dragão que chama o herói (dialogo.088, .068, .092); título com palavras comuns, traduzido como 'Príncipe do Mundo das Trevas' (confirmado pelo autor)"
- en: "Sphinx"
  pt: "Esfinge"
  nota: "caso cinzento: monstros ficam como no inglês, mas Sphinx é palavra comum com forma consagrada em português ('a Sphinx' soaria estranho); traduzida, também no banco 2 (confirmado pelo autor)"
- en: "Blacksmith"
  pt: "ferreiro"
  nota: "o ferreiro de Begonia (dialogo.068), citado pelos dragões (.073, .101); profissão, não nome: minúscula e com artigo"
- en: "Biomeka"
  pt: "Bio-Mecha"
  nota: "o chefe final, citado pelo príncipe (dialogo.111); o inglês grafa 'Biomeka' no diálogo e 'Bio-Mecha' no banco 2 (b2.029). Um nome só, a forma do banco 2, que já estava traduzida; nome de monstro, fica sem tradução"
- en: "Bio-Mecha"
  pt: "Bio-Mecha"
  nota: "nome do chefe final no banco 2 (b2.029), mantido; ver 'Biomeka'"
- en: "Gold Gem"
  pt: "Topázio"
  nota: "o Gold-Gem do banco 1 (b1, Topázio), escrito sem hífen no encaixe da pedra (dialogo.115)"
- en: "Blue Gem"
  pt: "Safira"
  nota: "o Blue-Gem do banco 1 (b1, Safira), escrito sem hífen no encaixe da pedra (dialogo.116)"
- en: "Gragg & Glagg"
  pt: "Gragg & Glagg"
  nota: "dupla de chefes (aviso dialogo.103, quiz b0.017); nomes de monstro, ficam, com o '&' do original como no quiz"
- en: "Almighty Demon King"
  pt: "Almighty Demon King"
  nota: "chefe (aviso dialogo.106: 'O Almighty Demon King!'); nome de monstro, fica como 'Tyrant Dragon' e 'Ice Bomber'"
- en: "Wonder Boy"
  pt: "Wonder Boy"
  nota: "nome da série, mantido (desfecho, dialogo.126)"
