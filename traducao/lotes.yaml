# Mapa de cenas: a que lote, lugar e personagem pertence cada diálogo e script.
#
# Um lote por tarefa de tradução, na ordem em que são traduzidos; `sem_traducao` guarda
# as strings que ficam vazias, com o motivo. O `id` de uma entrada é um diálogo inteiro
# (`dialogo.NNN` = todos os `.tNN`), um script do banco 3 (`b3.NNN`) ou uma entrada de
# outro arquivo (`b0.NNN.tNN`, `b2.NNN.tNN`, os ids de `inline.yaml`).
# `onde`: lugar e situação; `quem`: personagem, ou Placa, Narrador, Sistema.
# Locais marcados "a confirmar" foram deduzidos do texto; conferir no emulador.
#
# Os diálogos que só chamam um script do banco 3 (`[s3:00]` = loja, `[s3:01]` =
# estalagem) ficam no lote do script.
# Ordem dos lotes = ordem do jogo informada pelo autor: Alsedo, Castelo de Purapril e a
# Capital das Águas, Lilypad, fundo do mar e Deserto de Maugham, Begonia, o Mundo do Gelo e o
# vulcão, Childam, o final; `geral` reúne o que aparece em todo lugar.

