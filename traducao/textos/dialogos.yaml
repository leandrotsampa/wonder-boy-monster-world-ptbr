  pt: ''
  status: pendente
- id: dialogo.057.t01
  en: I'm Queen Eleanora.[espera][linha][linha]The monsters come[linha]from a cave just[linha]beyond the village.[espera][linha][linha]Can't you help us?[espera][linha][linha]Take Priscilla[linha]with you.[espera][linha][linha]She may be able to[linha]help you.[espera][linha][linha]Remember, though,[linha]that once you set[linha]foot outside[espera][linha]Alsedo, Priscilla[linha]will return to me,[linha]as she won't be[espera][linha]able to help you[linha]any more.[linha][espera]
  pt: 'Eu sou a rainha[linha]Eleanora.[espera][linha][linha]Os monstros saem[linha]de uma caverna[linha]logo após a vila.[espera][linha][linha]Será que você[linha]poderia nos ajudar?[espera][linha][linha]Leve Priscilla[linha]com você.[espera][linha][linha]Talvez ela possa[linha]ajudar.[espera][linha][linha]Mas lembre-se: ela[linha]só pode ajudar você[linha]aqui em Alsedo.[espera][linha][linha]Assim que você sair[linha]da vila, Priscilla[linha]voltará para mim.[espera]'
  status: revisado
- id: dialogo.057.t02
  en: Is Priscilla[linha]helping you?[espera]
  pt: Priscilla está[linha]sendo útil?[espera]
  status: revisado
- id: dialogo.056.t02
  en: You need the Ocarina[linha]to open the cave[linha]doors, but I lost it[espera][linha]somewhere inside the[linha]cave.[espera]
  pt: Você precisa da[linha]Ocarina para abrir as[linha]portas da caverna.[espera][linha][linha]Mas acabei perdendo[linha]a minha em algum[linha]lugar lá dentro![espera]
  status: revisado
