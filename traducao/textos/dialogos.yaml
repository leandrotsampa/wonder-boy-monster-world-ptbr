  pt: ''
  status: pendente
- id: dialogo.060.t01
  en: Keep in mind that[linha]when you equip a[linha]spear, you can't[espera][linha]use a shield.[espera][linha][linha]Remember this when[linha]selecting a weapon.[linha][espera]
  pt: Sabia que, com uma[linha]lança equipada, não[linha]dá para usar escudo?[espera][linha][linha]Pense nisso na hora[linha]de escolher sua arma.[linha][espera]
  status: revisado
- id: dialogo.060.t02
  en: Queen Eleanora is[linha]a wonderful person,[linha]isn't she?[espera]
  pt: A rainha Eleanora é[linha]uma pessoa incrível,[linha]não acha?[espera]
  status: revisado
- id: dialogo.060.t03
  en: Queen Eleanora was[linha]calling for you[linha]earlier.[espera][linha][linha]Why don't you pay her[linha]a visit?[linha][espera]
  pt: A rainha Eleanora[linha]estava chamando você[linha]agora há pouco.[espera][linha][linha]Por que não vai[linha]falar com ela?[linha][espera]
  status: revisado
- id: dialogo.061.t00
  en: '[s0:06]'
  pt: ''
  status: pendente
- id: dialogo.061.t01
  en: If it's the cave[linha]up ahead that you[linha]wish to know about,[espera][linha]go ask Sonia.[espera]
  pt: Quer saber da caverna[linha]logo ali na frente?[espera][linha][linha]Pergunte à Sonia.[espera]
  status: revisado
- id: dialogo.061.t02
  en: Our village is free![linha]We are all very[linha]grateful.[espera]
  pt: A vila está livre![linha]Todos nós somos[linha]muito gratos![espera]
  status: revisado
- id: dialogo.062.t00
  en: '[s0:06]'
  pt: ''
  status: pendente
- id: dialogo.062.t01
  en: Good morning.[linha]Did you sleep well?[espera][linha][linha]Good luck to you[linha]on your journey.[linha][espera]
  pt: Bom dia![linha]Dormiu bem?[espera][linha][linha]Boa sorte na sua[linha]jornada.[linha][espera]
  status: revisado
- id: dialogo.062.t02
  en: That was close.[espera][linha][linha]You shouldn't take[linha]chances like that![linha][espera][linha]Please be more[linha]careful![linha][espera]
  pt: Essa foi por pouco.[espera][linha][linha]Não se arrisque[linha]desse jeito![linha][espera][linha]Tome mais cuidado,[linha]por favor![linha][espera]
  status: revisado
- id: dialogo.056.t03
  en: Oh, it's the Ocarina![espera][linha][linha]You went there to[linha]look for it,[linha]didn't you?[espera][linha]The melody of the[linha]Ocarina may help to[linha]break the seals.[espera][linha][linha]Let's practice.[espera][linha][s3:07]Think you've got it?[espera][linha][linha]Play these melodies[linha]whenever you're in[linha]the cave.[espera]
  pt: Ah, a minha Ocarina![espera][linha][linha]Você foi até lá[linha]buscá-la, não foi?[espera][linha][linha]A melodia da Ocarina[linha]pode romper os selos.[espera][linha][linha]Vamos praticar.[espera][linha][s3:07]Já pegou o jeito?[espera][linha][linha]Toque estas melodias[linha]sempre que estiver[linha]na caverna.[espera]
  status: revisado
- id: dialogo.056.t04
  en: You've forgotten[linha]the melodies already?[espera][linha][linha]You're realy[linha]hopeless, you know?[espera][linha][linha]Let's practice them[linha]again.[espera][s3:07]Have you got it now?[espera][linha][linha]If you forget them[linha]again, come on back[espera][linha]and I'll help you[linha]out.[espera]
  pt: Já esqueceu as[linha]melodias?[espera][linha][linha]Você não tem jeito,[linha]sabia?[espera][linha][linha]Vamos praticar[linha]outra vez.[espera][s3:07]Pegou o jeito agora?[espera][linha][linha]Se esquecer de novo,[linha]é só voltar aqui que[linha]eu te ajudo.[espera]
  status: revisado
- id: dialogo.056.t05
  en: Thanks to you, the[linha]village is saved.[espera][linha][linha]Keep the Ocarina.[linha][linha][espera][linha][linha]It might come in[linha]handy.[linha][espera]
  pt: Graças a você,[linha]a vila está salva.[espera][linha][linha]Fique com a Ocarina.[linha][linha][espera][linha][linha]Pode vir a calhar.[linha][espera]
  status: revisado
- id: dialogo.056.t06
  en: Did the Ocarina[linha]prove useful?[espera]
  pt: E a Ocarina?[linha]Tem ajudado?[espera]
  status: revisado
- id: dialogo.057.t03
  en: Thank you so much.[espera][linha][linha]Alsedo is once more[linha]a peaceful village.[linha][espera][linha][linha]Go beyond the large[linha]tree and you'll[linha]reach Purapril.[espera][linha][linha]If you're ever in[linha]need of help of[linha]any kind, come and[espera][linha]see me.[espera][linha][linha]I'm forever in[linha]your debt.[linha][espera]
  pt: Muito obrigada![espera][linha][linha]Alsedo voltou a[linha]viver em paz.[linha][espera][linha][linha]Passando pela[linha]grande árvore, você[linha]chega a Purapril.[espera][linha][linha]Se um dia precisar[linha]de qualquer ajuda,[linha]venha me ver.[espera][linha][linha]Serei grata a você[linha]para sempre.[linha][espera]
  status: revisado
- id: dialogo.057.t04
  en: How's your journey[linha]going?[espera][linha][linha]There are still a[linha]great many people[linha]in need of your[espera][linha]help.[espera][linha][linha]Go now and do[linha]everything in your[linha]power to save them![espera]
  pt: Como vai a sua[linha]jornada?[espera][linha][linha]Ainda há muitas[linha]pessoas precisando[linha]da sua ajuda.[espera][linha][linha]Agora vá e faça[linha]tudo o que puder[linha]para salvá-las![espera]
  status: revisado
