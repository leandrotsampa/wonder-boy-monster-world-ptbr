- id: dialogo.056.t01
  en: I'm Sonia.[linha][espera][linha]The village is under[linha]attack.[linha][espera][linha]I don't know all the[linha]details, so you'd[linha]better see Eleanora.[espera][linha][linha]If you stand between[linha]the statues and look[linha]up, you can find her.[espera]
  pt: Eu sou a Sonia.[linha][espera][linha]A vila está sendo[linha]atacada.[linha][espera][linha]Não sei os detalhes,[linha]então é melhor você[linha]falar com Eleanora.[espera][linha][linha]É só ficar entre as[linha]estátuas e olhar para[linha]cima que você a vê.[espera]
  status: revisado
